name: app
description: "Inclusive Bible Generator - Accessible Bible verse graphics, captions, alt-text, and audio."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  flutter_tts: ^4.2.5
  google_fonts: ^8.2.1
  flutter_colorpicker: ^1.1.0
  image_picker: ^1.2.4
  gal: ^2.3.3
  url_launcher: ^6.3.1
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/backgrounds/
    - locales/
